{# Mobile bottom tab bar. Set active to: home | daily | spending | reconcile | loans #}
<nav class="app-tabbar" aria-label="Primary">

        <span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>
