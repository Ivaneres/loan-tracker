{# Desktop left rail. Set active to: home | daily | spending | reconcile | loans #}
<nav class="app-rail" aria-label="Primary">
    <a href="/" class="rail-brand">Tally</a>

    <a href="/" class="rail-link{% if active == 'home' %} is-active{% endif %}"{% if active == 'home' %} aria-current="page"{% endif %}>
        <span class="rail-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>
        Home
    </a>

    <p class="rail-h">Spending</p>
    <a href="/spending/daily" class="rail-link{% if active == 'daily' %} is-active{% endif %}"{% if active == 'daily' %} aria-current="page"{% endif %}>
        <span class="rail-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        Daily
    </a>
    <a href="/spending" class="rail-link{% if active == 'spending' %} is-active{% endif %}"{% if active == 'spending' %} aria-current="page"{% endif %}>
        <span class="rail-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
        Monthly
    </a>
    <a href="/spending/reconcile" class="rail-link{% if active == 'reconcile' %} is-active{% endif %}"{% if active == 'reconcile' %} aria-current="page"{% endif %}>
        <span class="rail-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        Reconcile
    </a>

    <p class="rail-h">Accounts</p>
    <a href="/loans" class="rail-link{% if active == 'loans' %} is-active{% endif %}"{% if active == 'loans' %} aria-current="page"{% endif %}>
        <span class="rail-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19"/></svg></span>
        Loans
    </a>

    <div class="rail-foot">Signed in as {{ username }}<a href="/logout">Log out</a></div>
</nav>
