{# Shared chrome. Requires: active (home|daily|spending|search|reconcile|loans), username #}
{% include 'partials/app_rail.html' %}
<header class="app-topbar">
    <a href="/" class="app-brand">Tally</a>
    <div class="app-topbar-right">
        <a href="/spending/search" class="app-icon-btn{% if active == 'search' %} is-active{% endif %}" aria-label="Search transactions" title="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        </a>
        <span class="app-session">Signed in as {{ username }}</span>
        <a href="/logout" class="app-btn app-btn--muted app-btn--logout">Logout</a>
    </div>
</header>
{% include 'partials/app_tabbar.html' %}
{% include 'partials/spend_modal.html' %}
<script src="{{ asset_url('spend_modal.js') }}" defer></script>
