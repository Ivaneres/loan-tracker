{# Shared chrome. Requires: active (home|daily|spending|search|loans), username #}
<header class="app-header">
    <div class="app-header-top">
        <a href="/" class="app-brand">Finance Tracker</a>
        <div class="app-header-right">
            <span class="app-session">Signed in as {{ username }}</span>
            <a href="/logout" class="app-btn app-btn--muted app-btn--logout">Logout</a>
        </div>
    </div>
    {% with active=active %}{% include 'partials/app_nav.html' %}{% endwith %}
</header>
