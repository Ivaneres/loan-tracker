<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reconcile statements</title>
    {% include 'partials/fonts.html' %}
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ asset_url('style.css') }}">
</head>
<body class="app-page spending-page reconcile-page min-h-screen">
    <div class="app-shell">
        {% with active='reconcile' %}{% include 'partials/app_header.html' %}{% endwith %}

        <section class="spending-section card reconcile-section" aria-labelledby="reconcile-heading" data-step="upload">
            <header class="reconcile-top">
                <div class="reconcile-top-copy">
                    <h2 class="spending-h2" id="reconcile-heading">Reconcile</h2>
                    <p class="reconcile-lead" id="reconcile-lead">Add every bank statement for this month.</p>
                </div>
                <div class="reconcile-top-meta">
                    <label class="reconcile-month-wrap" for="reconcile-month">
                        <span class="sr-only">Month</span>
                        <input id="reconcile-month" type="month" class="reconcile-month" value="{{ report_month }}" />
                    </label>
                    <span id="reconcile-status-chip" class="reconcile-status-chip hidden" aria-live="polite"></span>
                </div>
            </header>

            <ol class="reconcile-steps" id="reconcile-steps" aria-label="Progress">
                <li class="reconcile-steps-item is-current" data-go-step="upload">
                    <span class="reconcile-steps-num">1</span>
                    <span class="reconcile-steps-label">Add files</span>
                </li>
                <li class="reconcile-steps-item" data-go-step="review">
                    <span class="reconcile-steps-num">2</span>
                    <span class="reconcile-steps-label">Review</span>
                </li>
                <li class="reconcile-steps-item" data-go-step="confirm">
                    <span class="reconcile-steps-num">3</span>
                    <span class="reconcile-steps-label">Import</span>
                </li>
            </ol>

            <div id="reconcile-step-upload" class="reconcile-step">
                <div class="reconcile-composer">
                    <label class="reconcile-field" for="reconcile-source">
                        <span class="reconcile-field-label">Bank <span class="reconcile-field-optional">optional</span></span>
                        <input id="reconcile-source" type="text" class="reconcile-input" placeholder="e.g. Monzo, Amex" maxlength="80" list="reconcile-source-list" />
                        <datalist id="reconcile-source-list"></datalist>
                    </label>
                    <label class="reconcile-field reconcile-field--file" for="reconcile-file">
                        <span class="reconcile-field-label">Statement file</span>
                        <span class="reconcile-file-control">
                            <input id="reconcile-file" type="file" accept=".pdf,.csv,.txt,.xlsx,application/pdf,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" class="reconcile-file-input" />
                            <span class="reconcile-file-fake" aria-hidden="true">
                                <span class="reconcile-file-choose">Choose file</span>
                                <span id="reconcile-file-name" class="reconcile-file-name">No file selected</span>
                            </span>
                        </span>
                    </label>
                    <div class="reconcile-field reconcile-field--action">
                        <button type="button" id="reconcile-upload-btn" class="reconcile-btn reconcile-btn--soft">Add file</button>
                    </div>
                </div>
                <button type="button" id="reconcile-range-toggle" class="reconcile-text-btn reconcile-range-toggle" aria-expanded="false" aria-controls="reconcile-range-fields">Adjust date range</button>
                <div id="reconcile-range-fields" class="reconcile-range hidden">
                    <label class="reconcile-field" for="reconcile-period-start">
                        <span class="reconcile-field-label">From</span>
                        <input id="reconcile-period-start" type="date" class="reconcile-input" />
                    </label>
                    <label class="reconcile-field" for="reconcile-period-end">
                        <span class="reconcile-field-label">To</span>
                        <input id="reconcile-period-end" type="date" class="reconcile-input" />
                    </label>
                    <div class="reconcile-field reconcile-field--action">
                        <button type="button" id="reconcile-range-reset" class="reconcile-btn reconcile-btn--ghost">Reset to month</button>
                    </div>
                </div>
                <ul id="reconcile-upload-list" class="reconcile-upload-list" aria-label="Staged statements"></ul>
                <div class="reconcile-step-foot">
                    <button type="button" id="reconcile-auto-match-btn" class="reconcile-btn reconcile-btn--primary" disabled>Find matches</button>
                </div>
            </div>

            <div id="reconcile-step-review" class="reconcile-step hidden">
                <div id="reconcile-recap" class="reconcile-recap"></div>
                <p class="reconcile-step-nav">
                    <button type="button" id="reconcile-back-to-files" class="reconcile-text-btn">← Add another file</button>
                </p>
                <div id="reconcile-workspace" class="reconcile-work">
                    <div id="reconcile-phase-bank" class="reconcile-triage">
                        <div id="reconcile-focus" class="reconcile-focus"></div>
                        <div id="reconcile-suggestions" class="reconcile-suggestions"></div>
                        <div class="reconcile-triage-foot">
                            <div id="reconcile-actions" class="reconcile-actions"></div>
                            <div id="reconcile-queue-nav" class="reconcile-queue-nav"></div>
                        </div>
                    </div>
                </div>
                <div id="reconcile-view-all" class="reconcile-allrows">
                    <button type="button" id="reconcile-view-all-toggle" class="reconcile-text-btn" aria-expanded="false" aria-controls="reconcile-view-all-panel">Show all statement rows</button>
                </div>
                <div id="reconcile-view-all-panel" class="reconcile-view-all-panel hidden"></div>
            </div>

            <div id="reconcile-step-confirm" class="reconcile-step hidden">
                <div id="reconcile-summary-body" class="reconcile-summary-body"></div>
                <div class="reconcile-step-foot reconcile-step-foot--split">
                    <button type="button" id="reconcile-confirm-back" class="reconcile-btn reconcile-btn--ghost">← Back</button>
                    <button type="button" id="reconcile-final-confirm-btn" class="reconcile-btn reconcile-btn--primary">Confirm import</button>
                </div>
            </div>

            <p id="reconcile-status" class="reconcile-status hidden" role="status"></p>
        </section>
    </div>

    <script>
        window.SPENDING_CATEGORIES = {{ spending_categories | tojson }};
        window.KNOWN_BANK_SOURCES = {{ known_bank_sources | tojson }};
        window.RECONCILE_MONTH = {{ report_month | tojson }};
    </script>
    <script src="{{ asset_url('reconcile.js') }}"></script>
</body>
</html>
