# VPS deploy configuration for Tally — sourced by ~/scripts/deploy-generic.sh
# Usage:
#   ~/scripts/deploy-generic.sh /home/ivan/finance_tracker --yes
#   ~/scripts/deploy-generic.sh /home/ivan/finance_tracker --redeploy --yes

# --- Required ---
APP_NAME=tally
DOMAIN=tally.ereshchenko.com
SSH_HOST=root@195.201.98.136
BACKEND_DIR=.                    # Flask app lives at the project root
FRONTEND_DIR=.                   # No separate frontend; static/ is served by Flask/nginx
ENTRYPOINT=app:app
BACKEND_TYPE=wsgi                # Flask = wsgi

# --- Optional ---
PORT=5053
SERVICE_DESCRIPTION="Tally"
# Single worker: the ledger is one JSON file that every request reads and
# rewrites. One gunicorn worker serialises request handling so two concurrent
# requests cannot lose each other's writes. (Writes are also atomic + flocked.)
WORKERS=1

# Statement extraction allows 90s per chunk; stay above that.
GUNICORN_TIMEOUT=120
GUNICORN_CONF=gunicorn.conf.py

# PDFs are allowed up to 2MB in the app.
NGINX_CLIENT_MAX_BODY_SIZE=4m

# Jinja/static app — no React build step
FRONTEND_NONE=true

# JSON ledger on the server (DATA_PATH=data/ledger.json). Not provisioned here.
SETUP_DATABASE=none

FRONTEND_BUILD_CMD=true
FRONTEND_API_ENV_VAR=_UNUSED
